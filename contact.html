<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Contact Page</title>
</head>
<body class="d-flex flex-column min-vh-100 align-content: center">
<header>
<nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Products</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>
</header>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 md:col-10 lg:col-8">

<section class="form m-5 w-50">

    <div class="contact-header p-3 mb-2 bg-success fg-contrast-success">
        <h1 class="text-center">Contact Form</h1>
        <p class="text-center">Please fill out the form below in order to contact us.</p>
    </div>

    <div class="alert theme-info mb-4 animate__animated animate__fadeInDown" role="alert">
        <p class="mb-0"><strong>Customer Support:</strong> Our team typically responds to all inquiries within 24 business hours.</p>
    </div>

    <div class="first-name">
    <label for="exampleFormControlInput" class="form-label">First name</label>
    <input type="text" class="form-control" id="exampleFormControlInput" placeholder="John" m-5>
    </div>

    <div class="last-name">
    <label for="exampleFormControlInput" class="form-label">Last name</label>
    <input type="text" class="form-control" id="exampleFormControlInput" placeholder="Doe">
    </div>

    <div class="form-field">
        <label for="exampleFormControlSelect2" class="form-label">Gender select</label>
        <select class="form-control" id="exampleFormControlSelect2">
        <option>Choose one…</option>
        <option value="1">Male</option>
        <option value="2">Female</option>
        <option value="3">Other</option>
        </select>
    </div>

    <div class="email-address">   
    <label for="exampleFormControlInput" class="form-label ">Email address</label>
    <input type="email" class="form-control" id="exampleFormControlInput" placeholder="name@example.com">
    </div> 

    <div class="contact-number align-content-center="align-content: center;>
    <label for="exampleFormControlInput" class="form-label">Contact number</label>
    <input type="text" class="form-control" id="exampleFormControlInput" placeholder="0123456789">
    </div>

    <div class="form-field">
    <label for="exampleFormControlTextarea2" class="form-label text-center">Please type your feedback or suggestions below.</label>
    <textarea class="form-control" id="exampleFormControlTextarea2" rows="5"></textarea>
    </div>

    <button type="button" class="btn-solid theme-accent text-center">Submit</button>
    
</section>
</div>
</div>
</main>
<footer class="100vh">
        <h2 class="text-center">BootStrap<span> Store</span></h2>
        <p class="copyright text-center">© 2026 Bootstrap Store. All rights reserved.</p>
</footer>
</body>
</html>
